[package]
name = "clipvault"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "clipvault"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
desktop = ["dep:tauri-build", "dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2.12.7", optional = true, features = ["tray-icon", "image-png"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
arboard = { version = "3.7", default-features = true }
blake3 = "1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
serde_json = "1"
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
